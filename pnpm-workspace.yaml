allowBuilds:
  esbuild: true
minimumReleaseAge: 0

# parse-url still depends on this stub; parse-path ships its own types.
overrides:
  '@types/parse-path': '-'

# graphql-relay 0.10.2 still declares graphql ^16; connectionFromArray
# only uses GraphQL types that exist unchanged in 17.
peerDependencyRules:
  allowedVersions:
    graphql-relay>graphql: '17'
